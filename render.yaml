services:
  - type: web
    name: affine-self-hosted
    runtime: image
    image:
      url: ghcr.io/toeverything/affine-self-hosted:latest
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3010"
    disk:
      name: affine-data
      mountPath: /app/data
      sizeGB: 10
